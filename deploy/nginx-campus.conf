# ============================================================
# 引路学长 · 校园助手 Web 版 —— nginx 反代
# 放到 /etc/nginx/conf.d/yinlu-campus.conf
#
# 方案：独立端口对外（http://<服务器IP>:8081/）
# 理由：前端 bridge-web.js 硬编码绝对路径 /api/ 与 /api/events，
#       若用 /campus/ 路径前缀，必须改写这些请求，脆弱且易与「师说」的 /api 冲突。
# 前置：华为云安全组需放行 TCP 8081。
# ============================================================

server {
    listen 8081;
    server_name _;

    # 校园问答可能贴长文本
    client_max_body_size 2m;

    # 单 IP 并发保护（应用自身也有限流，这里做第二道）
    limit_conn perip 8;
    limit_req  zone=campus burst=6 nodelay;

    location / {
        proxy_pass http://127.0.0.1:8480;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 关键三项：关缓冲、关分块改写、放大读超时
        # 一次多工具问答实测要 30-40 s，超时给小了会中途断流
        proxy_buffering    off;
        proxy_cache        off;
        proxy_set_header   Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 静态资源与首页走短缓存，避免每次刷新重拉 792 KB
        proxy_max_temp_file_size 0;
    }

    location = /bridge-web.js {
        proxy_pass http://127.0.0.1:8480/bridge-web.js;
        proxy_set_header Host $host;
        expires 5m;
    }

    access_log /var/log/nginx/yinlu-campus.access.log;
    error_log  /var/log/nginx/yinlu-campus.error.log warn;
}

# ------------------------------------------------------------
# 备选：若要挂到「师说」同域名的子路径 /campus/（不推荐，仅记录做法）
#
# 需在主 server 块里加：
#   location /campus/ {
#       proxy_pass http://127.0.0.1:8480/;
#       sub_filter '"/api/'   '"/campus/api/';
#       sub_filter "'/api/"   "'/campus/api/";
#       sub_filter '"/bridge-web.js"' '"/campus/bridge-web.js"';
#       sub_filter_once off;
#       sub_filter_types application/javascript text/html;
#       proxy_set_header Accept-Encoding "";
#       proxy_buffering off;
#       proxy_read_timeout 300s;
#   }
#   location /campus/api/ {
#       proxy_pass http://127.0.0.1:8480/api/;
#       proxy_buffering off;
#       proxy_read_timeout 300s;
#   }
#
# 为什么脆弱：sub_filter 依赖前端产物里的字符串形态，前端一换构建就失效；
# 且 SSE 经过一层 rewrite 后容易出现"半截流"。能用独立端口就别用这个。
# ------------------------------------------------------------

# 限流区定义需放在 http 块（若 /etc/nginx/nginx.conf 里没有，加到其 http{} 内）：
#   limit_req_zone  $binary_remote_addr zone=campus:10m rate=20r/m;
#   limit_conn_zone $binary_remote_addr zone=perip:10m;

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>师说 · 无法连接</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f0e6;
        --fg: #17241e;
        --muted: #5d6b64;
        --accent: #146c56;
        --line: #e2dccf;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark {
        width: 84px;
        height: 84px;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: 0.12em;
      }
      p {
        margin: 0;
        max-width: 20em;
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        font-size: 14px;
        line-height: 1.8;
        color: var(--muted);
      }
      button {
        margin-top: 10px;
        padding: 12px 30px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #f7f1e3;
        font-family: inherit;
        font-size: 15px;
        letter-spacing: 0.08em;
        box-shadow: 0 8px 20px rgba(20, 108, 86, 0.22);
      }
      button:active {
        transform: translateY(1px);
      }
      .hint {
        font-size: 12px;
        color: #77837c;
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="18" fill="#14211c" />
        <path
          d="M14 18a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v13a6 6 0 0 1-6 6H27l-9 8v-8h-1a6 6 0 0 1-6-6V18Z"
          fill="#f6f1e5"
        />
        <path
          d="M26 34a5 5 0 0 1 5-5h14a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-2v6l-7-6H31a5 5 0 0 1-5-5v-9Z"
          fill="#2f8a70"
        />
        <circle cx="50" cy="52" r="5" fill="#d8a52a" />
      </svg>
      <h1>师说</h1>
      <p>暂时连接不上校园服务器。<br />请检查网络后重试，或稍后再打开。</p>
      <button type="button" onclick="location.replace('http://121.37.30.147/')">重新连接</button>
      <span class="hint">AI 先答 · 老师精答</span>
    </main>
  </body>
</html>

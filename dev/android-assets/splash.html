<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 2732px;
        height: 2732px;
        overflow: hidden;
        background: #f4f0e6;
      }
      .stage {
        width: 2732px;
        height: 2732px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 64px;
      }
      .mark {
        width: 460px;
        height: 460px;
      }
      .name {
        font-family: 'Songti SC', 'STSong', 'SimSun', serif;
        font-size: 168px;
        letter-spacing: 0.18em;
        margin-left: 0.18em;
        color: #14211c;
        font-weight: 600;
        line-height: 1;
      }
      .tagline {
        font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        font-size: 52px;
        letter-spacing: 0.08em;
        color: #5d6b64;
      }
      .rule {
        width: 96px;
        height: 4px;
        border-radius: 2px;
        background: #d8a52a;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg class="mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="18" fill="#14211c" />
        <path
          d="M14 18a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v13a6 6 0 0 1-6 6H27l-9 8v-8h-1a6 6 0 0 1-6-6V18Z"
          fill="#f6f1e5"
        />
        <path
          d="M26 34a5 5 0 0 1 5-5h14a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-2v6l-7-6H31a5 5 0 0 1-5-5v-9Z"
          fill="#2f8a70"
        />
        <circle cx="50" cy="52" r="5" fill="#d8a52a" />
      </svg>
      <div class="name">师说</div>
      <div class="rule"></div>
      <div class="tagline">AI 先答 · 老师精答</div>
    </div>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
        background: transparent;
      }
      svg {
        display: block;

    <!-- 严格控制在 Android 12+ SplashScreen 内部 2/3 安全区（682x682）内绘制圆润超椭圆图标，

      <rect x="242" y="242" width="540" height="540" rx="156" fill="#14211c" />
      <g transform="translate(512 512) scale(7.5) translate(-32 -32)">
        <path
          d="M14 18a6 6 0 0 1 6-6h20a6 6 0 0 1 6 6v13a6 6 0 0 1-6 6H27l-9 8v-8a6 6 0 0 1-4-5.65V18Z"
          fill="#f6f1e5"
        />
        <path
          d="M26 34a5 5 0 0 1 5-5h14a5 5 0 0 1 5 5v9a5 5 0 0 1-5 5h-2v6l-7-6H31a5 5 0 0 1-5-5v-9Z"
          fill="#2f8a70"
        />
        <circle cx="50" cy="52" r="5" fill="#d8a52a" />
      </g>
    </svg>
  </body>
</html>
